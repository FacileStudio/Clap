[package]
name = "worker"
description = "Clap's isolated render service: polls a directory for jobs and renders one at a time"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap-render = { path = "../../crates/render" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
tempfile = "3.27.0"
