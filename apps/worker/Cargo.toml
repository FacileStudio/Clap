[package]
name = "worker"
description = "Clap's isolated render service: polls a directory for jobs and renders or decodes one at a time"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap-media = { path = "../../crates/media" }
clap-render = { path = "../../crates/render" }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

