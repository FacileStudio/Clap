<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #18181b; color: #fafafa; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #27272a; }
  button { min-width: 72px; padding: 6px 12px; border: 0; border-radius: 8px; background: #3f3f46; color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #a1a1aa; outline-offset: 2px; }
  input[type="range"] { flex: 1; min-width: 0; }
  output { min-width: 17ch; text-align: right; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<iframe id="frame" src="/frame" sandbox="allow-scripts" allow="autoplay" title="Preview"></iframe>
<div class="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="0" step="0.001" value="0" aria-label="Time">
  <output id="time">0:00.00 / 0:00.00</output>
</div>
<script>
(function () {
  var frame = document.getElementById("frame");
  var play = document.getElementById("play");
  var scrub = document.getElementById("scrub");
  var time = document.getElementById("time");
  var duration = 0;
  var at = Number(sessionStorage.getItem("clap:time")) || 0;
  var playing = false;
  var started = 0;
  var origin = 0;

  function clock(t) {
    var minutes = Math.floor(t / 60);
    var seconds = t - minutes * 60;
    return minutes + ":" + (seconds < 10 ? "0" : "") + seconds.toFixed(2);
  }

  function post(message) {
    if (frame.contentWindow) frame.contentWindow.postMessage(message, "*");
  }

  function show(t) {
    at = Math.min(Math.max(t, 0), duration);
    scrub.value = String(at);
    time.textContent = clock(at) + " / " + clock(duration);
    sessionStorage.setItem("clap:time", String(at));
    post({ type: "scene:seek", t: at });
  }

  function tick(now) {
    if (!playing) return;
    var t = origin + (now - started) / 1000;
    if (t >= duration) {
      show(duration);
      set(false);
      return;
    }
    show(t);
    requestAnimationFrame(tick);
  }

  function set(on) {
    playing = on;
    play.textContent = on ? "Pause" : "Play";
    post({ type: "clap:playing", playing: on });
    if (!on) return;
    origin = at >= duration ? 0 : at;
    started = performance.now();
    requestAnimationFrame(tick);
  }

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (event.source !== frame.contentWindow || data.type !== "scene:ready") return;
    duration = Number(data.duration) || 0;
    scrub.max = String(duration);
    show(at);
  });
  play.addEventListener("click", function () { set(!playing); });
  scrub.addEventListener("input", function () { set(false); show(Number(scrub.value)); });
  window.addEventListener("keydown", function (event) {
    if (event.key !== " " || event.target !== document.body) return;
    event.preventDefault();
    set(!playing);
  });
  new EventSource("/__clap/events").onmessage = function () {
    set(false);
    frame.src = "/frame?" + Date.now();
  };
})();
</script>
</body>
</html>
