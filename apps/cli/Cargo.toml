[package]
name = "clap-cli"
version = "0.2.0"
description = "Clap, the Facile suite's video editor: the command line"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "clap_cli"
path = "src/lib.rs"

[[bin]]
name = "clap"
path = "src/main.rs"

[dependencies]
clap-render = { path = "../../crates/render" }
clap-timeline = { path = "../../crates/timeline" }
facile-scene = { git = "https://github.com/FacileStudio/Diapo", tag = "v0.2.0" }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.1"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tiny_http = "0.12.0"
ureq = "3.5.2"


