		<script>
			/*
			 * Vision counts visits to the two public pages only. A project page's path carries its id,
			 * so the tracker never loads there. It is a pinned copy served from this origin.
			 */
			(function () {
				if (location.hostname !== 'clap.facile.studio') return;
				if (location.pathname !== '/' && location.pathname !== '/downloads') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = '/vision-tracker.js';
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
