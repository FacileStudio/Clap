services:
  clap-db:
    container_name: clap-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clap-internal-db}
      POSTGRES_DB: clap
    volumes:
    - db_data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U clap
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
  clap-data-owner:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    command:
    - sh
    - -c
    - >-
      mkdir -p /data/renders &&
      chown 65532:65532 /data && chmod 0750 /data &&
      for entry in /data/* /data/.[!.]*; do [ -e "$$entry" ] && [ "$$entry" != /data/renders ] && chown -R 65532:65532 "$$entry"; done;
      rm -f /data/renders/.worker &&
      chown 65532:65532 /data/renders && chmod 3775 /data/renders
    volumes:
    - data:/data
  clap-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    volumes:
    - data:/data
    labels:
      journal.app: clap-api
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.clap-web.rule: "Host(`clap.facile.studio`)"
      traefik.http.routers.clap-web.entrypoints: web
      traefik.http.routers.clap-web.middlewares: redirect-to-https@file
      traefik.http.routers.clap-web.service: clap-api
      traefik.http.routers.clap-secure.rule: "Host(`clap.facile.studio`)"
      traefik.http.routers.clap-secure.entrypoints: websecure
      traefik.http.routers.clap-secure.tls.certresolver: letsencrypt
      traefik.http.routers.clap-secure.service: clap-api
      traefik.http.services.clap-api.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://clap:${POSTGRES_PASSWORD:-clap-internal-db}@clap-db:5432/clap?sslmode=disable}
      PORT: '4000'
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: 'private,cloudflare'
      DATA_DIR: /data
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PORTE_TOKEN_KEY: ${PORTE_TOKEN_KEY:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      OIDC_MACHINE_AUDIENCE: ${OIDC_MACHINE_AUDIENCE:-}
      MCP_RESOURCE: ${MCP_RESOURCE:-}
      MCP_STATE_KEY: ${MCP_STATE_KEY:-}
      BULLE_URL: ${BULLE_URL:-}
      BULLE_CLIENT_ID: ${BULLE_CLIENT_ID:-}
      SOURCE_MAX_BYTES: ${SOURCE_MAX_BYTES:-524288}
      ASSET_MAX_BYTES: ${ASSET_MAX_BYTES:-2147483648}
      SPACE_ASSETS_MAX_BYTES: ${SPACE_ASSETS_MAX_BYTES:-21474836480}
      RENDER_MAX_WIDTH: ${CLAP_RENDER_MAX_WIDTH:-1920}
      RENDER_MAX_HEIGHT: ${CLAP_RENDER_MAX_HEIGHT:-1080}
      RENDER_MAX_FPS: ${CLAP_RENDER_MAX_FPS:-30}
      RENDER_MAX_SECONDS: ${CLAP_RENDER_MAX_SECONDS:-600}
      RENDER_QUEUE_MAX: ${RENDER_QUEUE_MAX:-10}
      RENDER_USER_MAX: ${RENDER_USER_MAX:-2}
      UPLOADS_PER_USER: ${UPLOADS_PER_USER:-2}
      RENDER_BUNDLE_MAX_BYTES: ${RENDER_BUNDLE_MAX_BYTES:-1073741824}
      CLAP_FFMPEG: ${CLAP_FFMPEG:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMBED_ANCESTORS: ${EMBED_ANCESTORS:-https://prisme.facile.studio}
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      clap-db:
        condition: service_healthy
      clap-data-owner:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 3g
          pids: 512
  clap-render:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/bin/tini", "--", "/worker"]
    user: "65533:65532"
    network_mode: none
    read_only: true
    tmpfs:
    - /tmp:size=1g,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - seccomp=deploy/chrome-seccomp.json
    volumes:
    - type: volume
      source: data
      target: /data/renders
      volume:
        subpath: renders
    labels:
      journal.app: clap-render
    environment:
      CLAP_RENDERS_DIR: /data/renders
      CLAP_RENDER_MAX_WIDTH: ${CLAP_RENDER_MAX_WIDTH:-1920}
      CLAP_RENDER_MAX_HEIGHT: ${CLAP_RENDER_MAX_HEIGHT:-1080}
      CLAP_RENDER_MAX_FPS: ${CLAP_RENDER_MAX_FPS:-30}
      CLAP_RENDER_MAX_SECONDS: ${CLAP_RENDER_MAX_SECONDS:-600}
      CLAP_RENDER_TIMEOUT_SECONDS: ${CLAP_RENDER_TIMEOUT_SECONDS:-3600}
      CLAP_RENDER_FRAMES_MAX_BYTES: ${CLAP_RENDER_FRAMES_MAX_BYTES:-4294967296}
    healthcheck:
      test: ["CMD", "/worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      clap-data-owner:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '4'
          memory: 4G
          pids: 1024
volumes:
  db_data:
    name: clap_db_data
  data:
    name: clap_data
networks:
  dokploy-network:
    external: true
