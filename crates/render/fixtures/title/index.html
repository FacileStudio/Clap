<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Title fixture</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        font-family: sans-serif;
      }
      #title {
        margin: 0;
        font-size: 12vh;
        font-weight: 700;
        color: #f4f4f5;
        will-change: transform, opacity;
      }
      #bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 4vh;
        width: 0;
        background: #7c5cff;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="clip" data-start="0" data-duration="2" data-track-index="0">
        <h1 id="title">Clap</h1>
      </div>
      <div id="bar" class="clip" data-start="0" data-duration="2" data-track-index="1"></div>
    </div>
    <script>
      const title = document.getElementById('title');
      const bar = document.getElementById('bar');
      const duration = 2;
      const ease = (x) => 1 - Math.pow(1 - x, 3);

      window.__scene = {
        duration,
        seek(t) {
          const time = Math.min(Math.max(t, 0), duration);
          const enter = ease(Math.min(time / 0.8, 1));
          title.style.opacity = String(enter);
          title.style.transform = `translateY(${(1 - enter) * 40}px)`;
          bar.style.width = `${(time / duration) * 100}%`;
        }
      };
      window.__scene.seek(0);
    </script>
  </body>
</html>
